name: macOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "$BUILD_ARCH"
      - name: Safe app launch script tests
        run: bash script/tests/build_and_run_tests.sh
      - name: Core and native session tests
        run: swift test
      - name: Build development app bundle
        run: ./script/build_and_run.sh --build-only
      - name: Validate bundle metadata and signature
        run: |
          plutil -lint dist/pmind.app/Contents/Info.plist
          codesign --verify --strict dist/pmind.app
          test -x dist/pmind.app/Contents/MacOS/pmind
          lipo dist/pmind.app/Contents/MacOS/pmind -verify_arch "$BUILD_ARCH"
      - name: Archive app with executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/pmind.app "dist/pmind-macos-$BUILD_ARCH.zip"
          cd dist
          shasum -a 256 "pmind-macos-$BUILD_ARCH.zip" > "pmind-macos-$BUILD_ARCH.zip.sha256"
      - name: Validate archived app
        run: |
          ditto -x -k "dist/pmind-macos-$BUILD_ARCH.zip" "$RUNNER_TEMP/pmind-archive"
          test -x "$RUNNER_TEMP/pmind-archive/pmind.app/Contents/MacOS/pmind"
          codesign --verify --strict "$RUNNER_TEMP/pmind-archive/pmind.app"
      - name: Check home window on app launch
        run: |
          swiftc -swift-version 6 -parse-as-library script/tests/home_startup_smoke.swift -o "$RUNNER_TEMP/pmind-home-smoke"
          "$RUNNER_TEMP/pmind-home-smoke" "$RUNNER_TEMP/pmind-archive/pmind.app"
      - uses: actions/upload-artifact@v4
        with:
          name: pmind-macos-${{ matrix.arch }}
          path: |
            dist/pmind-macos-${{ matrix.arch }}.zip
            dist/pmind-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          {
            echo "Architecture: $BUILD_ARCH"
            echo "Artifact: pmind-macos-$BUILD_ARCH"
            echo 'Development signing only; this build is not notarized.'
          } >> "$GITHUB_STEP_SUMMARY"
  notes:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify-notes
      - name: Safe app launch script tests
        run: bash script/tests/build_and_run_tests.sh
      - name: Release publishing script tests
        run: bash script/tests/publish_release_tests.sh
  release:
    name: Publish development release
    needs: [native, notes]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pmind-macos-*
          path: release
          merge-multiple: true
      - name: Publish tested app archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_release.sh release
